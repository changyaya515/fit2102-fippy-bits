<!doctype html>
<html>
    <head>
        <title>FIT2102 A1 2026</title>
    </head>
    <body>
        <h1>Flippy Bit</h1>
        <main id="main" class="flex col">
            <svg id="svgCanvas" width="600" height="400">
                <g id="gameOver" visibility="hidden">
                    <rect
                        x="225"
                        y="176"
                        fill="white"
                        height="48"
                        width="150"
                    ></rect>
                    <text x="235" y="206">Game Over</text>
                </g>
            </svg>
            <div id="sideBar" class="flex col">
                <div id="info" class="flex col">
                    <div class="text">
                        <span class="left">Score: </span>
                        <span class="right" id="scoreText">0</span>
                    </div>
                    <div class="text">
                       <span class="left">Current: </span>
                       <span class="right" id="currentValueText">00</span>
                    </div>
                    <p>Base: <span id="baseText">16</span></p>
                    <input
                        type="range"
                        id="baseSlider"
                        min="0"
                        max="3"
                        step="1"
                        value="3"
                    />

                    <div id="controls">
                        <h2>Controls:</h2>
                        <table>
                            <tr>
                                <td>Get Multiplier</td>
                                <td>
                                    <div
                                        id="Space"
                                        class="key"
                                        style="width: 50px;"
                                    >
                                        Space
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>Restart</td>
                                <td>
                                    <div id="KeyR" class="key">R</div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
